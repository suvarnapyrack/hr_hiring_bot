version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hr_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hr_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 3

  hr_hiring_bot:
    build: .
    container_name: hr_hiring_bot_container
    command: ["streamlit", "run", "main.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/hr_bot_db
      - API_URL=http://api:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  api:
    build: .
    container_name: hr_api_backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/hr_bot_db
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  log_guardian:
    build: ./ai_log_guardian
    container_name: ai_log_guardian
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ai_log_guardian:/app
    env_file:
      - .env
    depends_on:
      - hr_hiring_bot
      - api
    restart: always

volumes:
  postgres_data:
